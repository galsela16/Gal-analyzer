<script>
window.addEventListener('load', function(){
  const menu=document.getElementById('uiMenu'), back=document.getElementById('uiMenuBackdrop'), btn=document.getElementById('uiMenuBtn');
  const traceBack=document.getElementById('uiTraceBackdrop');
  const close=()=>{menu.classList.remove('open');back.classList.remove('open');btn.classList.remove('on');btn.setAttribute('aria-expanded','false')};
  const toggle=()=>{const open=!menu.classList.contains('open');menu.classList.toggle('open',open);back.classList.toggle('open',open);btn.classList.toggle('on',open);btn.setAttribute('aria-expanded',String(open))};
  const click=(id)=>{const e=document.getElementById(id);if(e)e.click();};
  const setState=(txt)=>{const e=document.getElementById('uiMenuState');if(e)e.textContent=txt;};
  const closeTraces=()=>{document.body.classList.remove('ui-traces-open','ui-workspace-drawer');traceBack?.classList.remove('open');document.getElementById('uiWorkspaceBackdrop')?.classList.remove('open')};
  btn.addEventListener('click',toggle);back.addEventListener('click',close);traceBack?.addEventListener('click',closeTraces);
  document.getElementById('v5TraceClose')?.addEventListener('click',closeTraces);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();closeTraces();closeWorkspaceDrawer();}});

  const drawerBack=document.getElementById('uiWorkspaceBackdrop'),drawerLabel=document.getElementById('uiDrawerLabel');
  const closeWorkspaceDrawer=()=>{
    document.body.classList.remove('ui-workspace-drawer','ui-traces-open','ui-drawer-io','ui-drawer-generator','ui-drawer-traces');drawerBack?.classList.remove('open');traceBack?.classList.remove('open');
    if(typeof window.v52SetIo==='function')window.v52SetIo(false);
    if(typeof window.v53SetGeneratorDock==='function')window.v53SetGeneratorDock(false);
  };
  const openWorkspaceDrawer=(kind)=>{
    close();closeWorkspaceDrawer();
    if(kind==='traces'){
      window.focusPersistentTraces?.();
      return;
    }
    document.body.classList.add('ui-workspace-drawer','ui-drawer-'+kind);
    if(drawerLabel)drawerLabel.textContent=kind==='io'?'I/O & AUDIO':kind==='generator'?'GENERATOR':'TRACES';
    if(kind==='io'){if(typeof window.v52SetIo==='function')window.v52SetIo(true);else click('v52IoBtn');}
    if(kind==='generator'){if(typeof window.v53SetGeneratorDock==='function')window.v53SetGeneratorDock(true);else click('v52GenBtn');}
  };
  window.openWorkspaceDrawer=openWorkspaceDrawer;
  window.closeWorkspaceDrawer=closeWorkspaceDrawer;
  drawerBack?.addEventListener('click',closeWorkspaceDrawer);

  document.querySelectorAll('[data-settings-page]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('[data-settings-page]').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('[data-settings-content]').forEach(x=>x.classList.toggle('on',x.dataset.settingsContent===b.dataset.settingsPage));
  }));
  document.getElementById('uiSetTheme')?.addEventListener('click',()=>{click('sunBtn');setTimeout(syncStates,30)});
  document.getElementById('uiSetTarget')?.addEventListener('click',()=>{click('v5TargetToggle');setTimeout(syncStates,30)});
  document.querySelectorAll('[data-set-bpo]').forEach(b=>b.addEventListener('click',()=>{const src=document.querySelector('#v3ResMenu [data-bpo="'+b.dataset.setBpo+'"]');src?.click();}));
  document.getElementById('uiSetOpenIo')?.addEventListener('click',()=>openWorkspaceDrawer('io'));
  document.getElementById('uiSetOpenGen')?.addEventListener('click',()=>openWorkspaceDrawer('generator'));

  setInterval(()=>{
    const ready=document.getElementById('uiReadyText');if(!ready)return;
    const audio=(document.getElementById('v52AudioState')?.textContent||document.getElementById('v3AudioChip')?.textContent||'').toLowerCase();
    const running=/running|active|on|פעיל|פועל/.test(audio) && !/stopped|off|כבוי/.test(audio);
    ready.textContent=running?'AUDIO LIVE':'AUDIO OFF';
    document.getElementById('uiLivePill')?.classList.toggle('ready',running);
  },600);

  setInterval(()=>{
    const a=document.getElementById('v52AudioState')?.textContent||document.getElementById('v5LatencyStatus')?.textContent||'—';
    const out=document.getElementById('uiSetAudioState');if(out)out.textContent=a;
    const cg=document.getElementById('tfCohGateVal')?.textContent;const co=document.getElementById('uiSetCohState');if(co&&cg)co.textContent='Gate '+cg;
  },700);

  document.getElementById('uiGuide').onclick=()=>{close();click('guideBtn')};
  document.getElementById('uiHelp').onclick=()=>{close();click('helpBtn')};
  document.getElementById('uiPng').onclick=()=>{close();click('pngBtn')};
  document.getElementById('uiCsv').onclick=()=>{close();click('csvBtn')};

  setInterval(()=>{

<script>
(()=>{
 const health={mic:false,ref:false,snr:0,coh:0,clip:false,stable:false,ready:false,reason:'START AUDIO',history:[],noiseFloorDb:-90,micDb:-120,refDb:-120,headroomDb:120,noiseHistory:[]};
 window.measurementHealth=health;
 function numText(id,t,cls){const e=document.getElementById(id);if(e){e.textContent=t;e.className='mhItem '+cls}}
 function rms(a){if(!a||!a.length)return 0;let s=0;for(let i=0;i<a.length;i++)s+=a[i]*a[i];return Math.sqrt(s/a.length)}
 function db(v){return 20*Math.log10(Math.max(1e-8,v))}
 function updateHealth(){
   let micDb=-120,refDb=-120,clip=false,coh=0,stable=false;
   try{
     let ma=null,ra=null;
     if(typeof analyser!=='undefined'&&analyser){
       if(!window.__mhMic||window.__mhMic.length!==analyser.fftSize)window.__mhMic=new Float32Array(analyser.fftSize);
       analyser.getFloatTimeDomainData(window.__mhMic);ma=window.__mhMic;
     }
     if(typeof analyserRef!=='undefined'&&analyserRef){
       if(!window.__mhRef||window.__mhRef.length!==analyserRef.fftSize)window.__mhRef=new Float32Array(analyserRef.fftSize);
       analyserRef.getFloatTimeDomainData(window.__mhRef);ra=window.__mhRef;
     }
     if(ma?.length){micDb=db(rms(ma));for(let i=0;i<ma.length;i+=16)if(Math.abs(ma[i])>.985){clip=true;break}}
     if(ra?.length){refDb=db(rms(ra));for(let i=0;i<ra.length;i+=16)if(Math.abs(ra[i])>.985){clip=true;break}}
     if(typeof tfCurrentSnapshot==='function'){const s=tfCurrentSnapshot();if(s?.confidence)coh=s.confidence.meanCoh||0}
   }catch(_){}
   health.micDb=micDb;health.refDb=refDb;health.mic=micDb>-75;health.ref=refDb>-75;health.clip=clip;health.coh=coh;
   health.headroomDb=Math.max(0,-micDb);
   // Rolling measured noise-floor estimator: learn only from quiet/stable low-level windows.
   if(micDb<-38&&!clip){health.noiseHistory.push(micDb);if(health.noiseHistory.length>45)health.noiseHistory.shift();}
   if(health.noiseHistory.length>=6){
     const q=health.noiseHistory.slice().sort((a,b)=>a-b);
     health.noiseFloorDb=q[Math.floor(q.length*.35)];
   }
   health.snr=Math.max(0,Math.min(80,micDb-health.noiseFloorDb));
   const now=Date.now();health.history.push({t:now,micDb,refDb,coh});while(health.history.length>8||health.history[0].t<now-5000)health.history.shift();
   if(health.history.length>=3){const a=health.history.map(x=>x.micDb),av=a.reduce((x,y)=>x+y,0)/a.length,sd=Math.sqrt(a.reduce((x,y)=>x+(y-av)**2,0)/a.length);stable=sd<3.5}
   health.stable=stable;
   const tfOpen=!!document.querySelector('#v54TfGraphToggle.on');
   const noiseReady=health.noiseHistory.length>=6, snrOk=!noiseReady||health.snr>=15, headroomOk=health.headroomDb>=4;
   health.ready=health.mic&&!clip&&stable&&snrOk&&headroomOk&&(!tfOpen||(health.ref&&coh>=.5));
   health.reason=!health.mic?'LOW MIC':clip?'CLIPPING':health.headroomDb<4?'LOW HEADROOM':noiseReady&&health.snr<15?'LOW SNR':!stable?'UNSTABLE':tfOpen&&!health.ref?'LOW REF':tfOpen&&coh<.5?'LOW COHERENCE':'READY TO MEASURE';
   numText('mhMic','MIC '+(health.mic?'OK':'LOW'),health.mic?'ok':'bad');
   numText('mhRef','REF '+(health.ref?'OK':'—'),health.ref?'ok':'warn');
   numText('mhSnr','SNR '+Math.round(health.snr)+'dB',health.snr>=25?'ok':health.snr>=15?'warn':'bad');
   numText('mhNoise','NOISE '+(health.noiseHistory.length>=6?Math.round(health.noiseFloorDb)+'dB':'LEARN'),health.noiseHistory.length>=6?'ok':'warn');
   numText('mhHeadroom','HEADROOM '+Math.round(health.headroomDb)+'dB',health.headroomDb>=9?'ok':health.headroomDb>=4?'warn':'bad');
   numText('mhCoh','COH '+(coh?coh.toFixed(2):'—'),coh>=.7?'ok':coh>=.5?'warn':'bad');
   numText('mhClip','CLIP '+(clip?'YES':'NO'),clip?'bad':'ok');numText('mhStable','STABLE '+(stable?'YES':'NO'),stable?'ok':'warn');
   const r=document.getElementById('mhReady');if(r){r.textContent=health.reason;r.className='mhReady '+(health.ready?'ok':'bad')}
 }
 setInterval(updateHealth,850);

 // Delay repeatability layer, callable by current/future delay UI.
 const delayHistories=new Map();window.recordDelayReliability=function(ms,confidence=1,scope='path'){
   const key=String(scope||'path'),dh=delayHistories.get(key)||[],now=Date.now();
   dh.push({t:now,ms,confidence});while(dh.length>5)dh.shift();delayHistories.set(key,dh);
   if(dh.length<3)return {label:'PENDING',spread:null,count:dh.length,scope:key};
   const a=dh.map(x=>x.ms),av=a.reduce((x,y)=>x+y,0)/a.length,sd=Math.sqrt(a.reduce((x,y)=>x+(y-av)**2,0)/a.length);
   const c=dh.reduce((x,y)=>x+y.confidence,0)/dh.length,label=sd<=.18&&c>=.7?'HIGH':sd<=.5&&c>=.55?'MEDIUM':'LOW';
   return {label,spread:sd,mean:av,count:dh.length,scope:key};
 };
 window.resetDelayReliability=function(){delayHistories.clear();window.lastDelayRepeatability=null;};

 function mode(){return document.querySelector('#v54TfGraphToggle.on')?'TF':document.querySelector('#v54WaterfallToggle.on')?'WATERFALL':document.querySelector('#v54MrToggle.on')?'M/R':'RTA'}

 function renderTraceManager(){
   const box=document.getElementById('tsRows');if(!box||typeof v552GetTraces!=='function')return;
   const traces=v552GetTraces();box.innerHTML='';
   traces.forEach((t,i)=>{
     const r=document.createElement('div');r.className='tsRow';
     r.innerHTML='<input type="checkbox" data-ts-select="'+i+'"><input class="tsInput" value="'+String(t.name||'Trace').replace(/"/g,'&quot;')+'"><span>'+(t.type==='tf'?('TF · '+(t.verified===true?'Verified':'Unverified')):t.type==='mic-spectrum'?'MIC Spectrum':'RTA')+(t.spatialAverage?' · AVG':'')+'</span><button class="tsBtn" data-eye="'+i+'">'+(t.visible===false?'SHOW':'HIDE')+'</button><button class="tsBtn" data-del="'+i+'">DEL</button>';
     r.querySelector('.tsInput').onchange=e=>v552RenameTrace(i,e.target.value);
     r.querySelector('[data-eye]').onclick=()=>{v552ToggleTrace(i);renderTraceManager()};
     r.querySelector('[data-del]').onclick=()=>{v552DeleteTrace(i);renderTraceManager()};
     box.appendChild(r);
   });
 }

 document.getElementById('tsCapture').onclick=()=>{
   if(typeof captureWorkspaceTrace==='function')captureWorkspaceTrace();
   setTimeout(()=>{const tr=typeof v552GetTraces==='function'?v552GetTraces():[];if(tr.length){const t=tr[tr.length-1];t.name='Position '+tr.length+' · '+mode();if(typeof renderTfTraceLegend==='function')renderTfTraceLegend()}renderTraceManager()},30);
 };
 document.getElementById('tsAverage').onclick=()=>{
   const checks=[...document.querySelectorAll('[data-ts-select]:checked')].map(x=>+x.dataset.tsSelect);
   if(typeof v552SpatialAverage!=='function')return;
   const r=v552SpatialAverage(checks);
   if(!r.ok){alert(r.reason);return}
   if(typeof v3Toast==='function')v3Toast('Spatial Average created from '+checks.length+' traces');
   renderTraceManager();
 };
 document.getElementById('tsAll').onclick=()=>document.querySelectorAll('[data-ts-select]').forEach(x=>x.checked=true);
 document.getElementById('tsClose').onclick=()=>document.getElementById('traceSessionPanel').classList.remove('show');
 window.openMeasurementSession=()=>{document.getElementById('traceSessionPanel').classList.add('show');renderTraceManager()};

})();
</script>

<script>
(()=>{
 const advice={
  'LOW MIC':'Raise microphone/input level or move the measurement mic closer.',
  'CLIPPING':'Reduce MIC/REF gain. Clipped samples cannot produce a trustworthy measurement.',
  'LOW HEADROOM':'Reduce input gain slightly; keep at least ~4 dB digital headroom.',
  'LOW SNR':'Increase test-signal level or reduce background noise, then let NOISE relearn.',
  'UNSTABLE':'Hold the mic position and wait for the level to settle before capturing.',
  'LOW REF':'Raise or reconnect the reference channel before TF / Phase / Alignment.',
  'LOW COHERENCE':'Check delay/reference routing, improve SNR, and reduce reflections if possible.'
 };
 let last='';
 function updateGuide(){
   const h=window.measurementHealth,g=document.getElementById('mhGuide');if(!h||!g)return;
   const status=document.getElementById('mhReady');
   if(h.ready){g.textContent='';if(status)status.title='Measurement conditions are ready.';last='';return}
   const text=advice[h.reason]||'Wait for valid measurement conditions.';
   g.textContent=h.reason+' · '+text;
   if(status)status.title=text;
   last=h.reason;
 }
 setInterval(updateGuide,900);

 // Guard capture actions when health is clearly invalid.
 document.addEventListener('click',e=>{
   const b=e.target.closest('[data-ctx="capture"],#tfTraceBtn,#v5AddTrace,#tsCapture');
   if(!b)return;
   const h=window.measurementHealth;
   const tfCapture=b.id==='tfTraceBtn'||document.body.classList.contains('ctx-tf')||!!document.querySelector('#v54TfGraphToggle.on');
   if(h&&!h.ready&&['CLIPPING','LOW HEADROOM','LOW SNR','LOW REF','LOW COHERENCE'].includes(h.reason)&&!(tfCapture&&['LOW SNR','LOW REF','LOW COHERENCE'].includes(h.reason))){
     e.preventDefault();e.stopImmediatePropagation();
     const msg=(advice[h.reason]||'Improve measurement conditions before capture.');
     if(typeof v3Toast==='function')v3Toast(h.reason+' · '+msg);else alert(h.reason+' — '+msg);
   }
 },true);
})();
</script>

<script>
(()=>{
 const buttons={left:document.getElementById('leftRailToggle'),right:document.getElementById('rightRailToggle')};
 const resizeTimers={left:0,right:0};
 function settleLayout(side){
   cancelAnimationFrame(resizeTimers[side]);
   resizeTimers[side]=requestAnimationFrame(()=>{if(typeof resize==='function')resize()});
   clearTimeout(settleLayout[side]);
   settleLayout[side]=setTimeout(()=>{if(typeof resize==='function')resize()},230);
 }
 function setRail(side,open,persist=true){
   document.body.classList.toggle(side+'-rail-collapsed',!open);
   const b=buttons[side];
   if(b){
     const action=(open?'קפל ':'פתח ')+(side==='left'?'סרגל שמאלי':'סרגל ימני');
     b.textContent=side==='left'?(open?'‹':'›'):(open?'›':'‹');
     b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',action);b.title=action;
   }
   if(persist)try{localStorage.setItem('gal_'+side+'_rail_open',open?'1':'0')}catch(_){ }
   settleLayout(side);
 }
 for(const side of ['left','right']){
   let open=true;try{open=localStorage.getItem('gal_'+side+'_rail_open')!=='0'}catch(_){ }
   setRail(side,open,false);
   buttons[side]?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setRail(side,document.body.classList.contains(side+'-rail-collapsed'));});
 }
 window.setWorkspaceRail=setRail;
 window.focusPersistentTraces=()=>{
   setRail('left',true);
   requestAnimationFrame(()=>{const card=document.getElementById('targetTraceCard');card?.scrollIntoView({block:'nearest'});card?.focus({preventScroll:true});});
 };
 const canvas=document.getElementById('cv');
 canvas?.addEventListener('pointerdown',e=>{
   if(e.button!==undefined&&e.button!==0)return;
   const bothCollapsed=document.body.classList.contains('left-rail-collapsed')&&document.body.classList.contains('right-rail-collapsed');
   setRail('left',bothCollapsed);setRail('right',bothCollapsed);
   if(typeof window.closeWorkspaceDrawer==='function')window.closeWorkspaceDrawer();
   else{
     document.body.classList.remove('ui-workspace-drawer','ui-traces-open','ui-drawer-io','ui-drawer-generator','ui-drawer-traces');
     if(typeof window.v52SetIo==='function')window.v52SetIo(false);
     if(typeof window.v53SetGeneratorDock==='function')window.v53SetGeneratorDock(false);
   }
   document.getElementById('uiMenu')?.classList.remove('open');document.getElementById('uiMenuBackdrop')?.classList.remove('open');
   document.getElementById('uiMenuBtn')?.classList.remove('on');document.getElementById('uiMenuBtn')?.setAttribute('aria-expanded','false');
   document.querySelectorAll('.measureDock.open,#tfPanel.open,#alignBar.show').forEach(p=>p.classList.remove('open','expanded','show'));
   document.getElementById('modalBg')?.classList.remove('show');
   if(typeof updateMeasureDockHeight==='function')updateMeasureDockHeight();
 },{passive:true});
})();
</script>

<script>
(()=>{
 let peak=-Infinity;
 function syncMeasurementTarget(){
   const h=window.measurementHealth;if(!h)return;
   const main=document.getElementById('tmpMain'),pk=document.getElementById('tmpPeak'),sn=document.getElementById('tmpSnr'),co=document.getElementById('tmpCoh'),hr=document.getElementById('tmpHeadroom');
   if(main&&Number.isFinite(h.micDb))main.textContent=h.micDb.toFixed(1);
   if(Number.isFinite(h.micDb))peak=Math.max(peak,h.micDb);
   if(pk&&Number.isFinite(peak))pk.textContent=peak.toFixed(1)+' dBFS';
   if(sn)sn.textContent=Number.isFinite(h.snr)?Math.round(h.snr)+' dB':'—';
   if(co)co.textContent=Number.isFinite(h.coh)?h.coh.toFixed(2):'—';
   if(hr)hr.textContent=Number.isFinite(h.headroomDb)?Math.round(h.headroomDb)+' dB':'—';
   const sec=document.getElementById('tmpSecondary');if(sec)sec.textContent=h.reason||'LIVE INPUT';
   // Mirror existing RTA peak/cursor text if present; do not invent spectral values.
   const source=document.querySelector('#peakInfo,#rtaPeak,#peakReadout,.peakReadout,[data-peak-readout]');
   const hz=document.getElementById('tpkHz'),meta=document.getElementById('tpkMeta');
   if(source&&hz){hz.textContent=(source.textContent||'PEAK —').trim().slice(0,34);if(meta)meta.textContent='PEAK / HOLD';}
 }
 setInterval(syncMeasurementTarget,650);syncMeasurementTarget();
})();
</script>

<script>
(()=>{
 function syncWaterfallTarget(){
   const wf=!!document.querySelector('#v54WaterfallToggle.on');
   if(!wf)return;
   const sec=document.getElementById('tmpSecondary');
   const cand=(window.wfResonance?.candidates||[]).slice().sort((a,b)=>(b.resonanceConfidence||b.score||0)-(a.resonanceConfidence||a.score||0));
   const top=cand.find(c=>{
     const q=typeof waterfallConfidence==='function'?waterfallConfidence(c):(c.resonanceConfidence||c.score||0);
     return c.validated||((c.score||0)>=.72&&(c.prom||0)>=4&&q>=.62);
   });
   if(sec){
     if(top)sec.textContent=(top.validated?'DECAY VERIFIED':'PERSISTENT PEAK')+' · '+Math.round(top.hz||0)+' Hz · '+waterfallIssueLabel(top);
     else sec.textContent='WATERFALL · ANALYZING DECAY';
   }
   const hz=document.getElementById('tpkHz'),meta=document.getElementById('tpkMeta');
   if(hz&&top){
     const q=typeof waterfallConfidence==='function'?waterfallConfidence(top):(top.score||0);
     hz.textContent=Math.round(top.hz)+' Hz · '+Math.round(q*100)+'%';
     if(meta)meta.textContent=(top.validated?'DECAY VALIDATED · ':'PERSISTENT · ')+waterfallIssueLabel(top);
   }
 }
 setInterval(syncWaterfallTarget,700);
})();
</script>
